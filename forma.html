<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Formas</title>
</head>
<body style="font-family: Arial; padding: 20px;">
    <h1>Formas un ievadlauku piemērs</h1>
    <form>
        <p>Šodienas datums <input name="datums" readonly></p>
        <p>Ja gribi uzzināt šodienas datumu, spied pogu DATUMS 
            <input onclick="this.form.datums.value=new Date().toLocaleDateString();" name="poga" value="DATUMS" type="button">
        </p>
        <p>Ja gribi izdzēst datuma lodziņa saturu, spied pogu RESET
            <input value="RESET" type="reset">
        </p>
    </form>
    <hr>
    <form>
        <div>1.skaitlis <input type="number" id="sk1"></div>
        <div style="margin: 10px 0;">
            <input value="+" onclick="document.getElementById('rez').value = Number(document.getElementById('sk1').value) + Number(document.getElementById('sk2').value)" type="button">
            <input value="-" onclick="document.getElementById('rez').value = Number(document.getElementById('sk1').value) - Number(document.getElementById('sk2').value)" type="button">
            <input value="X" onclick="document.getElementById('rez').value = Number(document.getElementById('sk1').value) * Number(document.getElementById('sk2').value)" type="button">
            <input value="/" onclick="document.getElementById('rez').value = Number(document.getElementById('sk1').value) / Number(document.getElementById('sk2').value)" type="button">
            <input value="RESET" type="reset">
        </div>
        <div>2.skaitlis <input type="number" id="sk2"></div>
        <hr>
        <div>Rezultāts <input id="rez" readonly></div>
    </form>
</body>
</html>
