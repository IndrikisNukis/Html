<!DOCTYPE html>
<html>
<head>
    <title>Informācijas daudzuma mērvienības</title>
    <meta charset="UTF-8">
    <style>
        body {
            /* 9.a. Fonā attēls cipari.jpg */
            background-image: url("images/cipari.jpg");
            font-family: Arial, sans-serif;
        }
        .formas-kaste {
            /* 9.c. Krāsa 220 sarkanās, 220 zaļās (dzeltens) */
            background-color: rgb(220, 220, 0); 
            /* 9.b. Formas teksta izmērs 20px */
            font-size: 20px;
            padding: 30px;
            margin: 50px auto;
            width: 500px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
            text-align: center;
        }
        input {
            font-size: 20px;
            width: 100px;
            margin: 5px;
        }
        button {
            font-size: 20px;
            padding: 5px 15px;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1 style="text-align:center; background-color: rgba(255,255,255,0.8); display:inline-block; padding:10px;">Informācijas daudzuma mērvienības</h1>

<div class="formas-kaste">
    <form>
        <p>Ievadi Baitus: <input type="number" id="baiti"></p>
        <p>Rezultāts KiloBaitos (KB): <input type="text" id="kilo" readonly></p>
        <p>Rezultāts MegaBaitos (MB): <input type="text" id="mega" readonly></p>
        
        <button type="button" onclick="aprekinat()">Pārvērst mērvienībās</button>
        <button type="reset">Notīrīt</button>
    </form>
</div>

<script>
function aprekinat() {
    let baiti = document.getElementById("baiti").value;
    if (baiti !== "") {
        document.getElementById("kilo").value = (baiti / 1024).toFixed(2);
        document.getElementById("mega").value = (baiti / (1024 * 1024)).toFixed(6);
    } else {
        alert("Lūdzu, ievadiet baitu daudzumu!");
    }
}
</script>

</body>
</html>
